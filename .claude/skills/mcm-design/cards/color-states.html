<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px;font-family:var(--font-body);color:var(--text-body);background:var(--page-bg)}a{color:var(--color-link)}a:hover{color:var(--color-link-hover)}.sw{display:flex;gap:0;border-radius:var(--radius-sm);overflow:hidden}.sw>div{flex:1;height:78px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;font-family:var(--font-mono);font-size:10px;line-height:1.35}.n{font-size:10px;letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted);margin-bottom:6px}</style></head><body><div style="display:flex;gap:26px;flex-wrap:wrap;font-size:14px">
<div><div class="n">App link</div><a href="#" style="color:var(--color-link)">Missing child — what to do next</a></div>
<div><div class="n">Site link</div><a href="#" style="color:var(--color-link-site)">Contact us</a></div>
<div><div class="n">Hover</div><a href="#" style="color:var(--color-link-hover);text-decoration:underline">Contact us</a></div>
<div><div class="n">Valid</div><input value="Ava" style="outline:1px solid var(--state-valid-outline);border:1px solid var(--gray-400);border-radius:var(--radius-sm);padding:4px 6px;font:inherit;width:70px"></div>
<div><div class="n">Invalid</div><input value="" style="outline:1px solid var(--state-invalid-outline);border:1px solid var(--gray-400);border-radius:var(--radius-sm);padding:4px 6px;font:inherit;width:70px"></div>
</div></body></html>
