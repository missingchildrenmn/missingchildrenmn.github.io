<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px;font-family:var(--font-body);color:var(--text-body);background:var(--page-bg)}a{color:var(--color-link)}a:hover{color:var(--color-link-hover)}.sw{display:flex;gap:0;border-radius:var(--radius-sm);overflow:hidden}.sw>div{flex:1;height:78px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;font-family:var(--font-mono);font-size:10px;line-height:1.35}.n{font-size:10px;letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted);margin-bottom:6px}</style></head><body><div style="display:flex;align-items:flex-end;gap:16px"><div style="text-align:center"><div style="width:var(--space-1);height:var(--space-1);background:var(--brand-accent);border-radius:2px;margin:0 auto 6px"></div><div style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">.25rem</div></div><div style="text-align:center"><div style="width:var(--space-2);height:var(--space-2);background:var(--brand-accent);border-radius:2px;margin:0 auto 6px"></div><div style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">.5rem</div></div><div style="text-align:center"><div style="width:var(--space-3);height:var(--space-3);background:var(--brand-accent);border-radius:2px;margin:0 auto 6px"></div><div style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">1rem</div></div><div style="text-align:center"><div style="width:var(--space-4);height:var(--space-4);background:var(--brand-accent);border-radius:2px;margin:0 auto 6px"></div><div style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">1.5rem</div></div><div style="text-align:center"><div style="width:var(--space-5);height:var(--space-5);background:var(--brand-accent);border-radius:2px;margin:0 auto 6px"></div><div style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">3rem</div></div></div></body></html>
