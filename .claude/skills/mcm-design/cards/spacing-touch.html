<!-- @dsCard group="Spacing" viewport="700x150" name="Touch targets" subtitle="48px minimum on every app control; 32px resize grips" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px;font-family:var(--font-body);color:var(--text-body);background:var(--page-bg)}a{color:var(--color-link)}a:hover{color:var(--color-link-hover)}.sw{display:flex;gap:0;border-radius:var(--radius-sm);overflow:hidden}.sw>div{flex:1;height:78px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;font-family:var(--font-mono);font-size:10px;line-height:1.35}.n{font-size:10px;letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted);margin-bottom:6px}</style></head><body><div style="display:flex;align-items:center;gap:18px">
<div style="width:var(--touch-min);height:var(--touch-min);background:var(--brand-primary);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-mono);font-size:10px">48</div>
<div style="width:var(--touch-handle);height:var(--touch-handle);background:var(--gray-400);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:10px">32</div>
<div style="font-size:13px;color:var(--text-muted);max-width:420px">Parents use this app one-handed, in a crisis. 48&times;48 is a floor, not a target — the app's .btn-save, .btn-back and .btn-icon all inherit it.</div>
</div></body></html>
