<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px;font-family:var(--font-body);color:var(--text-body);background:var(--page-bg)}a{color:var(--color-link)}a:hover{color:var(--color-link-hover)}.sw{display:flex;gap:0;border-radius:var(--radius-sm);overflow:hidden}.sw>div{flex:1;height:78px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;font-family:var(--font-mono);font-size:10px;line-height:1.35}.n{font-size:10px;letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted);margin-bottom:6px}</style></head><body><div class="sw"><div style="background:var(--mcm-black-1);color:#fff"><span>#212121</span><span style="opacity:.75">mcm-black-1</span></div><div style="background:var(--mcm-black-2);color:#fff"><span>#404040</span><span style="opacity:.75">mcm-black-2</span></div><div style="background:var(--mcm-black-3);color:#fff"><span>#5e5e5e</span><span style="opacity:.75">mcm-black-3</span></div><div style="background:var(--mcm-black-4);color:#fff"><span>#797979</span><span style="opacity:.75">mcm-black-4</span></div></div></body></html>
