<!-- @dsCard group="Colors" viewport="700x140" name="Semantic surfaces" subtitle="Page, card, brand and note surfaces with their text pairing" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px;font-family:var(--font-body);color:var(--text-body);background:var(--page-bg)}a{color:var(--color-link)}a:hover{color:var(--color-link-hover)}.sw{display:flex;gap:0;border-radius:var(--radius-sm);overflow:hidden}.sw>div{flex:1;height:78px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;font-family:var(--font-mono);font-size:10px;line-height:1.35}.n{font-size:10px;letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted);margin-bottom:6px}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
<div style="background:var(--page-bg);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);padding:10px;height:88px"><div class="n">--page-bg</div><div style="color:var(--text-body);font-size:13px">Body on page</div><div style="color:var(--text-muted);font-size:12px">--text-muted</div></div>
<div style="background:var(--surface-card);border:1px solid var(--border-strong);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);padding:10px;height:88px;box-sizing:border-box"><div class="n">--surface-card</div><div style="font-size:13px">Card surface</div></div>
<div style="background:var(--surface-brand);border-radius:var(--radius-sm);padding:10px;height:88px;box-sizing:border-box"><div class="n" style="color:rgba(255,255,255,.7)">--surface-brand</div><div style="color:var(--text-on-brand);font-size:13px">Toolbar text</div></div>
<div style="background:var(--surface-note);border-radius:var(--radius-sm);padding:10px;height:88px;box-sizing:border-box"><div class="n">--surface-note</div><div style="font-size:13px">Note / warning</div></div>
</div></body></html>
