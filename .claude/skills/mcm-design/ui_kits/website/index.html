<!DOCTYPE html><html><head><meta charset="utf-8"><title>Missing Children Minnesota</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{margin:0}body{background:var(--page-bg)}a{color:var(--color-link-site)}a:hover{color:var(--color-link-hover)}</style>
</head><body><div id="root"></div>
<script type="text/babel" src="SiteShell.jsx"></script>
<script type="text/babel" src="HomePage.jsx"></script>
<script type="text/babel" src="MissingChildPage.jsx"></script>
<script type="text/babel" src="ResourcesPage.jsx"></script>
<script type="text/babel" src="SupportPage.jsx"></script>
<script type="text/babel" src="AboutPage.jsx"></script>
<script type="text/babel">
const B='../../assets/imagery/';
const PAGES={
  'Home':{title:null,banner:B+'index-banner.png',render:s=>window.HomePage(s)},
  'Missing Child':{title:'Missing Child',banner:B+'missing-child-banner.jpg',render:()=>window.MissingChildPage()},
  'Resources':{title:'Resources',banner:B+'support-banner.jpg',render:()=>window.ResourcesPage()},
  'Support':{title:'Support',banner:B+'support-banner.jpg',render:()=>window.SupportPage()},
  'Contact':{title:'Contact',banner:B+'contact-banner.jpg',render:()=>window.ContactPage()},
  'About MCM':{title:'About MCM',banner:B+'about-mcm-banner.jpg',render:()=>window.AboutPage()},
  'Child Safety':{title:'Child Safety',banner:B+'child-safety-banner.jpg',render:()=>window.ChildSafetyPage()},
  'Blog':{title:'Blog',banner:null,render:()=>window.BlogPage()}
};
function App(){
  const [page,setPage]=React.useState('Home');
  const p=PAGES[page]||PAGES['Home'];
  return <window.SiteShell page={page} setPage={setPage} title={p.title} banner={p.banner}>{p.render({setPage})}</window.SiteShell>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
