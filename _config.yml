# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you: 
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Missing Children Minnesota
email: general.info@missingchildrenmn.com
# The mission statement, verbatim. It does three jobs: the lead paragraph on the
# home page, the <meta name="description"> and og:description that jekyll-seo-tag
# builds, and the opening of /about-mcm/. It is longer than the ~155 characters a
# search snippet shows, so results truncate it -- accepted deliberately rather
# than paraphrasing an approved statement.
description: >- # this means to ignore newlines until "baseurl:"
  The mission of Missing Children Minnesota is to support families through personal safety education programs for children and to provide support and referral services to the families of missing children.

# Short mission summary. This exists solely to keep the home page's <title> to a
# sane length: jekyll-seo-tag builds that title as `site.title | tagline`, and
# falls back to the full site.description when no tagline is set -- which made a
# 231-character title where a search result shows about 60. Not rendered on any
# page; changing it changes only the home page's browser tab and search listing.
tagline: Abduction prevention education and support for searching families

# The vision statement, verbatim. Rendered in the footer of every page and on
# /about-mcm/. It is kept out of the home page's lead on purpose: the brand book
# reserves aspirational, institutional voice for the history section, and the
# home page's first words should be concrete for a reader who may be in crisis.
vision: >-
  We envision a world where all young people in the state of Minnesota have the skills and resources to be safe. Caregivers have the resources to nurture, guide, and protect their young people.

baseurl: "" # the subpath of your site, e.g. /blog
# The live hostname (see CNAME). jekyll-seo-tag builds canonical and og:url from
# this; leaving it blank made local builds emit http://localhost:4000 canonicals.
url: "https://missingchildrenmn.com"
author: Missing Children Minnesota
twitter_username: missingchildmn
github_username:  missingchildrenmn
permalink: /:year/:month/:day/:title/

# Nav order. The theme's _includes/header.html falls back to alphabetical page
# order when this is unset, which buried Missing Child -- the crisis page -- in
# fifth place. Ordered here by how urgently a visitor needs the page.
#
# Labels come from each page's `nav_title`, falling back to its `title`. Only
# missing-child.markdown sets one: it appears here as "Get Help Now" while its
# own <h1> stays "Missing Child". A Donate button closes the nav; it is markup
# in header.html, not a page, so it is not listed here.
header_pages:
  - missing-child.markdown
  - child-safety.markdown
  - resources.markdown
  - support.markdown
  - about.markdown
  - blog.html
  - contact.markdown

# og:image -- the card shown when a page is shared, which for this site is often
# during a search. It has to be a Jekyll default rather than a top-level `image:`
# key: jekyll-seo-tag's ImageDrop reads page["image"] and never falls back to
# site["image"], so a site-level key silently does nothing. Defaults populate
# each page's front matter, which the plugin does read.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/social-card.jpg

# Contact details of record. These are safety-critical: the header bar, the
# footer and contact.markdown all read from here so the numbers can never drift
# apart. Copy changes only from an authoritative source -- never invent one.
mcm:
  phone: "612.334.9449"
  phone_href: "tel:+16123349449"
  hotline: "888.RUN.YELL"
  hotline_digits: "888.786.9355"
  hotline_href: "tel:+18887869355"
  address_line1: "P.O. Box 1111"
  address_line2: "Minnetonka, MN 55345"
  social:
    - name: Facebook
      url: https://www.facebook.com/Missingchildrenmn
    - name: Instagram
      url: https://www.instagram.com/missing_children_minnesota/
    - name: Twitter/X
      url: https://x.com/MissingChildMN
    - name: Mastodon
      url: https://mstdn.social/@MissingChildMN

# Build settings
#theme: minima
remote_theme: aterenin/minima-reboot
plugins:
  - jekyll-feed


# Exclude from processing.
#
# IMPORTANT: this list REPLACES Jekyll's built-in defaults, it does not add to
# them. (The stock Jekyll scaffold comment claims otherwise; that was true of an
# older Jekyll and is not true of the 3.x line GitHub Pages builds with.) So the
# default entries below must be repeated verbatim -- deleting one starts
# publishing that file. Verify with a build: anything left out shows up in
# _site/ and therefore on the live site.
#
# Repo-only files must be listed here or Jekyll publishes them: a root-level
# .md file otherwise becomes a public page.
#
# The exception is anything whose name starts with "." or "_": Jekyll filters
# those out before this list is even consulted, and only an explicit `include:`
# key (which this site does not set) can bring one back. That is why .claude/
# and .github/ need no entry below -- adding one would be harmless but is noise.
exclude:
  # repo-only, not part of the site
  - CLAUDE.md
  # the CC BY-NC-ND license covering this repo. GitHub surfaces it from the
  # repo root; it was being served at /LICENSE as a bare text page, which is
  # not site content. Nothing links to that URL.
  - LICENSE
  # the github-pages gem excludes this by default; GitHub Pages manages the
  # custom domain from the repo-root CNAME + repo settings, not from _site/
  - CNAME
  # Jekyll's own defaults, restated because this list overrides them
  - Gemfile
  - Gemfile.lock
  - gemfiles
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .sass-cache
  - .jekyll-cache
